const postsEl = document.getElementById('posts');
DATA.posts.forEach((p, i) => {
  const rank = i + 1;
  const rankClass = rank <= 3 ? `rank-${rank}` : 'rank-other';
  const views = p.views >= 10000 ? (p.views / 10000).toFixed(1) + '万' : p.views;
  postsEl.innerHTML += `
    <div class="post-item">
      <div class="post-title"><span class="post-rank ${rankClass}">${rank}</span><a href="https://xueqiu.com/${p.user_id}/${p.id}" target="_blank">${p.title}</a></div>

        <span>💬 ${p.reply}</span>
        <span>👁️ ${views}</span>

      </div>
      <div class="post-desc">${p.desc}</div>
    </div>`;
});

const stocksEl = document.getElementById('stocks');
DATA.stocks.forEach((s, i) => {
  const zdf = parseFloat(s.zdf);
  const cls = zdf > 0 ? 'up' : zdf < 0 ? 'down' : '';
  const sign = zdf > 0 ? '+' : '';
  stocksEl.innerHTML += `
    <tr>
      <td>${i + 1}</td>
      <td>${s.name}</td>
      <td style="color:#8e8e93;font-size:11px">${s.code}</td>
      <td class="${cls}">${sign}${s.zdf}%</td>
      <td>${s.price}</td>
    </tr>`;
});

const statsEl = document.getElementById('stats');
DATA.stats.forEach(st => {
  statsEl.innerHTML += `
    <div class="stat-card">
      <div class="value">${st.value}</div>
      <div class="label">${st.label}</div>
    </div>`;
});

// Seeking Alpha news
const saEl = document.getElementById('saPosts');
if (DATA.saNews && DATA.saNews.length > 0) {
  DATA.saNews.forEach((n, i) => {
    const rank = i + 1;
    const rankClass = rank <= 3 ? `rank-${rank}` : 'rank-other';
    // Parse ticker string like "AAPL -1.89%"
    const tickerMatch = n.ticker ? n.ticker.match(/^(\S+)\s+([+-]?[\d.]+%)?/) : null;
    const tickerSym = tickerMatch ? tickerMatch[1] : (n.ticker || '');
    const tickerChg = tickerMatch && tickerMatch[2] ? tickerMatch[2] : '';
    const tickerCls = tickerChg.startsWith('+') ? 'up' : tickerChg.startsWith('-') ? 'down' : '';
    let tickerHtml = '';
    if (tickerSym) {
      tickerHtml = `<span class="sa-ticker ${tickerCls}">${tickerSym}${tickerChg ? ' ' + tickerChg : ''}</span>`;
    }
    saEl.innerHTML += `
      <div class="sa-news-item">
        <div class="sa-news-title"><span class="post-rank ${rankClass}">${rank}</span><a href="${n.url}" target="_blank">${n.title}</a></div>
        ${n.summary ? `<div class="post-desc">${n.summary}</div>` : ''}
        <div class="sa-news-meta">
          ${tickerHtml}
          <a href="${n.url}" target="_blank" class="post-link">查看原文 ↗</a>
        </div>
      </div>`;
  });
} else {
  saEl.innerHTML = '<div style="color:#8e8e93;font-size:14px;padding:12px 0">暂无数据</div>';
}
